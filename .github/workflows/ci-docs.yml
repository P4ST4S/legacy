name: CI • Docs
on: [push, pull_request]
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Build MkDocs (strict)

        # Sphinx variant (uncomment if needed)
        # - name: Build Sphinx (strict)
        #   run: uvx sphinx-build -W -b html docs docs/_build/html
      - name: Upload docs build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            site/
            docs/_build/html/
          if-no-files-found: warn
