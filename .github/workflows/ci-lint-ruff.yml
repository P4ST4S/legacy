name: CI • Lint (Ruff)
on: [push, pull_request]
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lint : ruff check
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      # Format : ruff format --check
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
