name: CI • Build (sdist/wheel)
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Construire (PEP 517)
        run: uvx --from build pyproject-build
      - name: Vérifier les distributions
        run: uvx twine check dist/*
      - name: Upload artifacts (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
